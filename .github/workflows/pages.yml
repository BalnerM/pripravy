# Sestaví všechny přípravy (každý předmět má vlastní <předmět>/_build/build.py) a nasadí je na GitHub Pages.
name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sestavení stránek
        run: |
          for f in */_build/build.py; do
            echo "== $f"
            python "$f"
          done
      - name: PDF verze (headless Chrome, předinstalovaný na runneru)
        run: |
          for f in */_build/make_pdf.py; do
            echo "== $f"
            python "$f"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
