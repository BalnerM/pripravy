<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Přípravy na zkoušky</title>
<meta name="description" content="Rozcestník studijních příprav na zkoušky.">
<script>try{var t=localStorage.getItem("vmm-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);var f=parseFloat(localStorage.getItem("vmm-fs"));if(f>=.8&&f<=1.6)document.documentElement.style.setProperty("--fs",f)}catch(e){}</script>
<style>
:root {
  color-scheme: light;
  --bg: #f9f9f7; --surface: #fcfcfb; --ink: #1a1a19; --ink-2: #52514e; --muted: #7a7873;
  --line: #e1e0d9; --line-strong: #c9c7be; --accent: #2a78d6; --accent-ink: #1c5cab;
  --shadow: 0 1px 2px rgba(11,11,11,.06), 0 4px 16px rgba(11,11,11,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a988f;
    --line: #2c2c2a; --line-strong: #44443f; --accent: #5598e7; --accent-ink: #86b6ef;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a988f;
  --line: #2c2c2a; --line-strong: #44443f; --accent: #5598e7; --accent-ink: #86b6ef;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
header { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--line); }
header .spacer { flex: 1; }
header b { font-weight: 650; }
button {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; height: 34px; padding: 0 10px; font: inherit; font-size: 14px; cursor: pointer;
}
button:hover { border-color: var(--line-strong); }
main { max-width: 860px; margin: 0 auto; padding: 40px 16px 64px; zoom: var(--fs, 1); }
.fsgroup { display: inline-flex; gap: 4px; }
button:disabled { opacity: .4; cursor: default; }
h1 { font-size: 32px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.01em; }
.lead { color: var(--ink-2); font-size: 18px; margin: 0 0 32px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
a.card {
  display: block; padding: 18px 20px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); box-shadow: var(--shadow); color: var(--ink); text-decoration: none;
}
a.card:hover { border-color: var(--accent); }
.card .n, .mat .n { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
.card .t { font-size: 19px; font-weight: 650; margin: 4px 0 6px; }
.card .d { color: var(--ink-2); font-size: 14.5px; }
.crumbs { font-size: 14px; margin: 0 0 16px; }
.crumbs a { color: var(--accent-ink); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.mat { display: block; padding: 18px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
.mat .t { font-size: 19px; font-weight: 650; margin: 4px 0 6px; }
.mat .d { color: var(--ink-2); font-size: 14.5px; margin: 0 0 12px; }
.mat .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.mat .acts a { display: inline-block; padding: 5px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; color: var(--accent-ink); text-decoration: none; }
.mat .acts a:first-child { background: var(--accent); border-color: var(--accent); color: #fff; }
.mat .acts a:hover { border-color: var(--accent); }
.card .c { color: var(--muted); font-size: 13px; margin-top: 10px; }
footer { color: var(--muted); font-size: 13.5px; margin-top: 40px; }
footer a { color: var(--accent-ink); }
</style>
</head>
<body>
<header>
  <b>Přípravy na zkoušky</b>
  <span class="spacer"></span>
  <span class="fsgroup">
    <button id="fsDown" type="button" title="Zmenšit písmo" aria-label="Zmenšit písmo">A−</button>
    <button id="fsVal" type="button" title="Původní velikost písma">100 %</button>
    <button id="fsUp" type="button" title="Zvětšit písmo" aria-label="Zvětšit písmo">A+</button>
  </span>
  <button id="themeBtn" type="button">Tmavý režim</button>
</header>
<main>
  <div id="view"></div>
  <noscript>
    <h1>Přípravy na zkoušky</h1>
    <ul><li><a href="vmm/">Vícerozměrné metody (VMM)</a></li><li><a href="mlr/">Strojové učení (MLR)</a></li></ul>
  </noscript>
  <footer>Zdroje a historie verzí: <a href="https://github.com/BalnerM/pripravy">github.com/BalnerM/pripravy</a></footer>
</main>
<script>
(function () {
  var b = document.getElementById("themeBtn"), r = document.documentElement;
  function dark() {
    var t = r.getAttribute("data-theme");
    return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function label() { b.textContent = dark() ? "Světlý režim" : "Tmavý režim"; }
  b.addEventListener("click", function () {
    var t = dark() ? "light" : "dark";
    r.setAttribute("data-theme", t);
    try { localStorage.setItem("vmm-theme", t); } catch (e) {}
    label();
  });
  label();

  var STEPS = [0.85, 0.9, 0.95, 1, 1.05, 1.1], DEF = 3, down = document.getElementById("fsDown"),
      up = document.getElementById("fsUp"), val = document.getElementById("fsVal");
  function idx() {
    var f = parseFloat(r.style.getPropertyValue("--fs")) || 1, best = DEF;
    STEPS.forEach(function (s, i) { if (Math.abs(s - f) < Math.abs(STEPS[best] - f)) best = i; });
    return best;
  }
  function setFs(i) {
    i = Math.max(0, Math.min(STEPS.length - 1, i));
    r.style.setProperty("--fs", STEPS[i]);
    try { localStorage.setItem("vmm-fs", STEPS[i]); } catch (e) {}
    val.textContent = Math.round(STEPS[i] * 100) + " %";
    down.disabled = i === 0; up.disabled = i === STEPS.length - 1;
  }
  down.addEventListener("click", function () { setFs(idx() - 1); });
  up.addEventListener("click", function () { setFs(idx() + 1); });
  val.addEventListener("click", function () { setFs(DEF); });
  setFs(idx());
})();
</script>
</body>
</html>
<script>
// Nový předmět = nový objekt v PREDMETY; nový materiál = nový objekt v jeho "materialy".
// Každý materiál: typ (štítek), nazev, popis, odkazy [[text, href], ...] (první odkaz je hlavní tlačítko).
var PREDMETY = [
  {
    id: "vmm", zkratka: "VMM", nazev: "Vícerozměrné metody",
    popis: "Předzpracování, korelace, shlukování, PCA, kernel PCA, SVD, faktorová analýza, t-SNE, UMAP.",
    materialy: [
      { typ: "Skripta · ústní zkouška", nazev: "Skripta k ústní zkoušce",
        popis: "Přednášky 1–11: definice, intuice, řešené příklady, grafy a otázky ke zkoušce s odpověďmi. Slovník pojmů a tahák.",
        odkazy: [["Otevřít skripta", "vmm/"], ["Celá na jedné stránce", "vmm/skripta_vse.html"], ["PDF", "vmm/pdf/skripta_vse.pdf"]] }
    ]
  },
  {
    id: "mlr", zkratka: "MLR", nazev: "Strojové učení",
    popis: "Optimalizace, hodnocení modelů, redukce dimenze, lineární modely a SVM, stromy a ansámbly, neuronové sítě.",
    materialy: [
      { typ: "Skripta · zkouška", nazev: "Skripta (česky)",
        popis: "Přednášky 1–7. U každého modelu co dělají jeho parametry; tahák a slovník.",
        odkazy: [["Otevřít skripta", "mlr/"], ["Celá na jedné stránce", "mlr/skripta_vse.html"], ["PDF", "mlr/pdf/skripta_vse.pdf"]] },
      { typ: "Skripta · zkouška", nazev: "Notes (English)",
        popis: "Anglická verze stejných skript, v jednoduché angličtině.",
        odkazy: [["Open notes", "mlr/en/"], ["All on one page", "mlr/en/skripta_vse.html"], ["PDF", "mlr/en/pdf/skripta_vse.pdf"]] }
    ]
  },
  {
    id: "sad", zkratka: "SAD", nazev: "Měření a zpracování biosignálů",
    popis: "Základy obvodů, RC filtry a operační zesilovače; přednášky: úprava signálu, napájení a reference, komparátor, ADC/DAC, multiplexace.",
    materialy: [
      { typ: "Skripta · půlsemestrální test", nazev: "Příprava na půlsemestrální test",
        popis: "Jen látka testu – základy Z1–Z4: obvody a dělič, dolní/horní/pásmová propust a zádrž, zapojení s OZ. Odvození, řešené příklady, schémata, tahák, slovník a otázky.",
        odkazy: [["Otevřít skripta", "sad/"], ["Tahák", "sad/05_tahak.html"], ["Slovník pojmů", "sad/99_slovnik.html"], ["Celá na jedné stránce", "sad/skripta_vse.html"], ["PDF", "sad/pdf/skripta_vse.pdf"]] },
      { typ: "Skripta · závěrečná zkouška", nazev: "Příprava na závěrečnou zkoušku",
        popis: "Přednášky P1–P7 (další přibývají) k přečtení jako celek: základy jsou vložené přímo do přednášek jako připomenutí v místě, kde jsou potřeba. Tahák, slovník a otázky.",
        odkazy: [["Otevřít skripta", "sad/zkouska/"], ["Tahák", "sad/zkouska/29_tahak.html"], ["Slovník pojmů", "sad/zkouska/99_slovnik.html"], ["Celá na jedné stránce", "sad/zkouska/skripta_vse.html"], ["PDF", "sad/zkouska/pdf/skripta_vse.pdf"]] }
    ]
  }
];

(function () {
  var view = document.getElementById("view");
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function plural(n) { return n + (n === 1 ? " materiál" : n >= 2 && n <= 4 ? " materiály" : " materiálů"); }

  function home() {
    document.title = "Přípravy na zkoušky";
    var h = '<h1>Přípravy na zkoušky</h1>' +
      '<p class="lead">Vyber předmět. Uvnitř najdeš všechny materiály k němu: skripta, taháky a další.</p><div class="cards">';
    PREDMETY.forEach(function (p) {
      h += '<a class="card" href="#' + p.id + '"><div class="n">' + esc(p.zkratka) + '</div>' +
        '<div class="t">' + esc(p.nazev) + '</div><div class="d">' + esc(p.popis) + '</div>' +
        '<div class="c">' + plural(p.materialy.length) + ' →</div></a>';
    });
    view.innerHTML = h + '</div>';
  }

  function subject(p) {
    document.title = p.nazev + " – Přípravy na zkoušky";
    var h = '<p class="crumbs"><a href="#">← Všechny předměty</a></p>' +
      '<h1>' + esc(p.nazev) + '</h1><p class="lead">' + esc(p.zkratka) + ' · ' + esc(p.popis) + '</p><div class="cards">';
    p.materialy.forEach(function (m) {
      h += '<div class="mat"><div class="n">' + esc(m.typ) + '</div>' +
        '<div class="t">' + esc(m.nazev) + '</div><p class="d">' + esc(m.popis) + '</p><div class="acts">';
      m.odkazy.forEach(function (o) { h += '<a href="' + esc(o[1]) + '">' + esc(o[0]) + '</a>'; });
      h += '</div></div>';
    });
    view.innerHTML = h + '</div>';
  }

  function route() {
    var id = decodeURIComponent(location.hash.replace(/^#/, "")), p = null;
    PREDMETY.forEach(function (x) { if (x.id === id) p = x; });
    if (p) subject(p); else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
